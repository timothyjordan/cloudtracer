<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>CloudTracer</title>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">cloud<span class="brand-accent">tracer</span></span>
      <div class="topbar-right">
        <span id="domain" class="domain"></span>
        <div class="actions">
          <button
            id="copy"
            class="icon-btn"
            type="button"
            title="Copy result as JSON"
            aria-label="Copy result as JSON"
            disabled
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
            </svg>
          </button>
          <button
            id="rescan"
            class="icon-btn"
            type="button"
            title="Re-scan"
            aria-label="Re-scan"
            disabled
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
              <path d="M21 3v6h-6"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="content" class="content"></main>
    <footer class="footer">
      Runs in your browser. Reads public DNS, registration, and certificate
      records directly.
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
